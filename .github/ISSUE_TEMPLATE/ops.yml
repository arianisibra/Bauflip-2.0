name: Ops Request
description: Finance, Legal, Admin, Operations — ohne Code
title: "[Ops] "
labels: ["type:ops"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - BauFlip
        - CiaoSepp
        - Velixar
        - Shared
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
