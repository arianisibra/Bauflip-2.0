name: Bug
description: Defekt oder fehlerhaftes Verhalten
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - BauFlip
        - CiaoSepp
        - Velixar
        - Shared
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 Critical
        - P1 High
        - P2 Normal
        - P3 Low
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
